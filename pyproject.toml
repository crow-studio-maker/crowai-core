[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crowai-core"
version = "4.2.0"
description = "Secure, model-package-ready Flask runtime for CrowAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Flask==3.1.3",
  "waitress==3.0.2",
  "requests==2.32.5",
  "beautifulsoup4==4.14.3",
  "python-dotenv==1.2.2",
  "pypdf==5.9.0",
  "openpyxl==3.1.5",
  "PyMuPDF==1.26.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["crowai", "models"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 65

[tool.ruff]
target-version = "py311"
line-length = 140
exclude = ["dist", "build", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["examples/model-package-template"]
