name: Core CI

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install pip==26.2.1
      - run: pip install -r requirements-dev.txt
      - run: python -c "import flask, werkzeug; print('flask/werkzeug import OK')"
      - run: python tools/check_dependencies.py
      - run: python tools/check_format.py
      - run: ruff check .
      - run: mypy crowai tools
      - run: python -m tools.validate_model_package models/chat/v1.0
      - run: python -m tools.validate_model_package models/code/v1.0
      - run: python -m tools.validate_model_package models/agent/v1.0
      - run: python -m compileall -q crowai models tools tests
      - run: node --check static/workspace.js
      - name: Pytest with branch coverage and no missing-Flask skips
        shell: bash
        run: |
          set -o pipefail
          pytest -q -ra -p pytest_cov --cov=crowai --cov=models --cov-branch --cov-report=term-missing --cov-fail-under=68 | tee /tmp/crowai-pytest.txt
          if grep -Fq "Flask is not installed" /tmp/crowai-pytest.txt; then
            echo "Unexpected Flask-missing skip in CI" >&2
            exit 1
          fi

  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install pip==26.2.1
      - run: pip install -r requirements-dev.txt
      - run: docker pull python:3.13-slim@sha256:9662417aace5ae7b8e2609cce472b72a8958e134ba372808abe9cc1a0c0125e6
      - run: pytest -q -p no:cacheprovider tests/unit/test_final_hardening.py -k real_docker_backend

  release-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pip==26.2.1
      - run: pip install -r requirements-dev.txt
      - name: Strict one-command final verification
        run: python tools/final_verify.py --coverage-gate 68
      - run: test -f dist/verification-summary.json
      - run: test -f dist/CrowAI-Core-4.2.0.zip
      - run: python tools/validate_release.py --core-release dist/CrowAI-Core-4.2.0.zip
      - run: test -f .github/workflows/ci.yml
      - run: test ! -e github/workflows/ci.yml

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install pip==26.2.1 pip-audit==2.10.1
      - run: pip-audit -r requirements.txt
